[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "genplib"
version = "0.0.0.a3"
description = "CLI-утилита для создания Python библиотеки"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "kirill1943" }
]
dependencies = ["Typer", "tomlkit"]

[project.scripts]
genplib = "genplib.cli:run"

[tool.setuptools]
packages = ["genplib", "genplib.modules", "genplib.utils"]