[build-system]
requires = ["setuptools>=61.0"]

[project]
name = "genplib"
version = "0.0.0.a2"
description = "CLI-утилита для создания Python библиотеки"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "kirill1943" }
]
dependencies = ["Typer", "tomlkit"]

[project.scripts]
genplib = "genplib.cli:run"